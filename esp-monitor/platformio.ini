; esp-monitor 当前使用 ESP-IDF 原生方式驱动 ST7789 屏幕。
; 已验证可工作的硬件组合：
; - 开发板：AirM2M CORE ESP32-C3
; - 屏幕：GMT024-10 V2.1，240x320 SPI TFT
; - 当前固件：基于 esp_lcd 的 ST7789 bring-up / 调试版本
;
; 说明：
; - 本文件保留“当前已验证有效”的最小配置。
; - 屏幕引脚和时序现在写在 src/main.cpp 中，由 ESP-IDF 原生驱动使用。
; - 之前 Arduino/TFT_eSPI 方案遗留的 lib_deps / build_flags 已移除，避免混淆。

[env:airm2m_core_esp32c3]
; ESP32-C3 平台包。
platform = espressif32

; 板卡定义。这里保持为你已经验证能正常下载和串口输出的板型。
board = airm2m_core_esp32c3

; 当前项目使用 ESP-IDF，而不是 Arduino。
; 这样可以直接使用 esp_lcd / spi_master / FreeRTOS 等原生组件。
framework = espidf

; 实际板载 Flash 为 2MB。
; 显式覆盖默认板卡容量，避免构建时出现“Expected 4MB, found 2MB”警告。
board_build.flash_size = 2MB
board_upload.flash_size = 2MB

; 固定烧录串口，避免 PlatformIO 自动探测到错误端口。
; 如果以后换了 USB 口，需要同步修改这里。
monitor_port = COM3
upload_port = COM3

; 当前串口监视波特率。
; 115200 对调试日志更稳，足够用于 bring-up 阶段。
monitor_speed = 115200

; 为串口日志增加时间戳，便于观察初始化和循环刷屏节奏。
monitor_filters = time

; 预留：如果后续需要追加全局编译宏，可在这里恢复 build_flags。
; 例如：
; build_flags =
;   -D APP_LOG_LEVEL=3
