[project]
name = "data-collector"
version = "0.1.0"
description = "PC sensor data collector for the PC-Sensor-Panel project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "uvicorn[standard]>=0.44.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
