[project]
name = "data-collector"
version = "0.1.0"
description = "PC sensor data collector for the PC-Sensor-Panel project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.119.1",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "uvicorn[standard]>=0.42.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
